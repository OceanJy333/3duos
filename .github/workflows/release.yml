name: Build IPA
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix (build artifact only)
        required: true
        default: '0.1.1'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Check core and layout, build IPA
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/build-ipa.sh "$VERSION" "$GITHUB_RUN_NUMBER" > build-ipa.log 2>&1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3duos-${{ steps.version.outputs.value }}-unsigned
          path: |
            build/release/*.ipa
            build/release/*.sha256
          if-no-files-found: error
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-ipa.log
      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: build/release/*unsigned.ipa*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --prerelease --title "3duos $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE.md
