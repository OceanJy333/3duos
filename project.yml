name: 3duos
options:
  bundleIdPrefix: xyz.ocean33
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  3duos:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - Core
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ocean33.3duos.lab
        PRODUCT_NAME: 3duos Lab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  3duos:
    build:
      targets:
        3duos: all
    run:
      config: Debug
