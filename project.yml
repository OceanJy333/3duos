name: 3duos
options:
  bundleIdPrefix: xyz.ocean33
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
targets:
  3duos:
    type: application
    platform: iOS
    sources:
      - App
      - UI
      - Core
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ocean33.3duos.lab
        PRODUCT_NAME: 3duos Lab
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_OPTIMIZATION_LEVEL: -Ounchecked        # the interpreter and renderer are unusably slow unoptimized, even in Debug
        SWIFT_ENFORCE_EXCLUSIVE_ACCESS: unchecked
        GCC_OPTIMIZATION_LEVEL: s
schemes:
  3duos:
    build:
      targets:
        3duos: all
    run:
      config: Debug
